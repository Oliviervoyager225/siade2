name: siade2
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  gap:
  sizer:
  flutter_svg:
  carousel_slider:
  intl:
  go_router:
  flutter_staggered_grid_view:
  video_player:
  google_maps_flutter:
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  dio: ^5.4.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^10.0.0
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_gen_runner:
  build_runner:

  flutter_lints: ^5.0.0

# The following section is specific to Flutter packages.
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/videos/video.mp4

flutter_native_splash:
  color: "#7404D0"
  color_dark: "#7404D0"

  android_12:
    color: "#7404D0"
    color_dark: "#7404D0"

  android: true
  ios: true
  fullscreen: true
  web: false


flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
